# =====================================================================
# #22 — 验收工具链固化：单测 + cantools 43.0.2 严格模式对拍
#
# 严格模式下「cantools 不可用」= 失败（exit 4），杜绝无环境静默假绿。
# =====================================================================
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  cantools-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned cantools environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import cantools; print('cantools', cantools.__version__)"
      - run: npm ci
      - name: Cross-check (strict: a missing environment fails the build)
        run: npm run compare -- --strict
